<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Thank You — Hillblends & Co</title>
    <meta
      name="description"
      content="Thank you for choosing Hillblends & Co. Get in touch with us."
    />
    <meta name="theme-color" content="#F3EDD8" />
    <link rel="icon" href="logo.png" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="./assets/fonts/BeauRivage-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Playfair+Display:wght@500;600&family=Lora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="fonts-loading">
    <div class="loading-screen" aria-live="polite" aria-busy="true">
      <div class="loading-screen__panel">
        <p class="loading-screen__eyebrow">Hillblends &amp; Co</p>
        <div class="loading-screen__spinner" aria-hidden="true"></div>
        <p class="loading-screen__message">Preparing your thank you note…</p>
      </div>
    </div>

    <main class="card page-content">
      <header class="brand" data-reveal>
        <!-- Replace logo.svg with your own logo image later — keep the same filename,
         or update the src below to point at your new file. -->
        <img
          class="brand__logo"
          src="logo.png"
          alt="Hillblends & Co"
          width="88"
          height="88"
        />
      </header>

      <section class="hero" data-reveal>
        <h1 class="hero__title">Thank&nbsp;you</h1>
        <p class="hero__line">for choosing Hillblends &amp; Co.</p>
        <p class="hero__line hero__line--sub">
          Every purchase supports a tradition we're proud to share.
        </p>
      </section>

      <div class="divider" data-reveal aria-hidden="true">
        <span class="divider__rule"></span>
        <svg class="divider__leaf" viewBox="0 0 40 24" fill="none">
          <path
            class="divider__leaf-shape"
            d="M20 22 C 20 14, 14 6, 4 2 C 10 12, 12 18, 20 22 Z"
            stroke="#5B6B3E"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="divider__leaf-shape"
            d="M20 22 C 20 14, 26 6, 36 2 C 30 12, 28 18, 20 22 Z"
            stroke="#5B6B3E"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            class="divider__leaf-vein"
            d="M20 22 L20 3"
            stroke="#3B4726"
            stroke-width="1.2"
            stroke-linecap="round"
          />
        </svg>
        <span class="divider__rule"></span>
      </div>

      <h2 class="touch-label" data-reveal>Get in touch</h2>

      <nav class="contacts" aria-label="Contact options">
        <a class="contact-btn" href="tel:+918413823978" data-reveal>
          <span class="contact-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.4 21 3 13.6 3 4.5c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="contact-btn__text">
            <span class="contact-btn__label">Let's talk or Chat!</span>
            <span class="contact-btn__value">+91 84138 23978</span>
          </span>
          <span class="contact-btn__go" aria-hidden="true">&rsaquo;</span>
        </a>

        <a class="contact-btn" href="mailto:hillblends@gmail.com" data-reveal>
          <span class="contact-btn__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect
                x="3"
                y="5.5"
                width="18"
                height="13"
                rx="1.6"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M4 6.5l8 6.5 8-6.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="contact-btn__text">
            <span class="contact-btn__label">Email us</span>
            <span class="contact-btn__value">hillblends@gmail.com</span>
          </span>
          <span class="contact-btn__go" aria-hidden="true">&rsaquo;</span>

      </nav>

      <footer class="tagline" data-reveal>
        <p class="tagline__text">Homemade. Heartfelt.</p>
        <p class="tagline__year">
          &copy; <span id="year"></span> Hillblends &amp; Co
        </p>
      </footer>
    </main>

    <script src="script.js"></script>
